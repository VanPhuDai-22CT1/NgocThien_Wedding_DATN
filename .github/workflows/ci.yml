name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-database-only
          MYSQL_DATABASE: ngoc_thien_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-database-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ngoc_thien_ci
      DB_USER: root
      DB_PASSWORD: ci-database-only
      JWT_SECRET: isolated-ci-signing-key-not-for-deployment
      PORT: 5000
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Build backend
        run: npm --prefix backend run build

      - name: Initialize isolated test database
        run: npm --prefix backend run init-db

      - name: Start API and wait for readiness
        shell: bash
        run: |
          node backend/dist/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run backend smoke tests
        run: npm --prefix backend test

      - name: Report API errors
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" 2>/dev/null || true

      - name: Stop test API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
          fi

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: npm run build --if-present
